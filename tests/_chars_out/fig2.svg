<text x="52" y="42" fill="#2C2C2A" font-size="12.5" font-weight="500">每方 9 个前沿点(行5列k)，各自向【就近那一侧】的对手过河，接到对方行5列(10−k)</text>
<text x="52" y="58" fill="#5F5E5A" font-size="12.5" font-weight="400">绿＝吴→魏过河段；橙＝吴→蜀过河段（同一结构在魏方、蜀方各旋转 120° 复制一份）</text>
<text x="52" y="74" fill="#993C1D" font-size="12.5" font-weight="500">三处天然共线：k=9→蜀列1、k=1→魏列9、k=5↔5 —— 也就是您说的「只有 1↔9 天然共线」</text>
<text x="340" y="620" fill="#5F5E5A" font-size="12" text-anchor="middle">全盘 3 方 × 9 列 × 2 侧 = 54 条过河段，逐条数值验证全部精确命中</text>
